name: 🐞 Bug report
description: Something does not work as expected
title: "🐞 "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to report a problem! Please check the existing issues first.
  - type: textarea
    id: description
    attributes:
      label: 📝 What happened?
      description: A clear description of the problem.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 🔁 Steps to reproduce
      placeholder: |
        1. Search for "Lviv"
        2. Open the settings and choose °F, mph
        3. …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: ✅ Expected behaviour
    validations:
      required: true
  - type: input
    id: location
    attributes:
      label: 📍 City or address
      description: The page address helps to reproduce forecast problems.
      placeholder: /?lat=49.84&lon=24.03
  - type: input
    id: version
    attributes:
      label: 🏷️ Version
      description: Shown in the footer of the app.
      placeholder: v1.0.0
  - type: input
    id: environment
    attributes:
      label: 💻 Browser and device
      placeholder: Chrome 140 on macOS 26, Safari on iPhone 17…
    validations:
      required: true
  - type: dropdown
    id: theme
    attributes:
      label: 🎨 Appearance
      description: Settings → Appearance
      options:
        - Auto
        - Light
        - Dark
  - type: dropdown
    id: effects
    attributes:
      label: ✨ Effects
      description: Settings → Effects; Auto shows which level the device got.
      options:
        - Auto, full on this device
        - Auto, reduced on this device
        - Full
        - Reduced
  - type: textarea
    id: context
    attributes:
      label: 📎 Screenshots or extra context
